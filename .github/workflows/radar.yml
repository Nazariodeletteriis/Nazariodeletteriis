name: Charts and cards

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/skills.json"
      - "assets/langmix.json"
      - "scripts/radar.py"
      - "scripts/cards.py"

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/radar.py --data assets/skills.json -o assets/radar
      - run: python scripts/radar.py --data assets/langmix.json -o assets/radar-langs --values
      - name: Stats card
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/cards.py --user "${{ github.repository_owner }}" --out assets
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/radar-*.svg assets/card-*.svg
          git diff --staged --quiet || git commit -m "chore: refresh charts"
          git push
